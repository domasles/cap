# CAP Project API

api:
  public:
    cap_core:
      location: "core/cap_core/__init__.py"
      exports:
        - "ConfigService"
        - "ValidationService"
        - "ValidationIssue"
        - "ValidationResult"
        - "WorkspaceValidation"
        - "MCPFormatter"
        - "__version__"
      stability: "stable"

    cap_mcp:
      location: "mcp/cap_mcp/__init__.py"
      exports:
        - "create_server"
        - "__version__"
      stability: "stable"

    cap_cli:
      location: "shells/cli/cap_cli/main.py"
      exports:
        - "cli"
        - "main"
      stability: "stable"

    cap_vscode:
      location: "shells/vscode/src/extension.ts"
      exports:
        - "activate"
        - "deactivate"
      stability: "stable"

  internal:
    domain_models:
      location: "core/cap_core/domain/models/**"
      exports:
        - "DependenciesYAML"
        - "ArchitectureYAML"
        - "ApiYAML"
        - "PackageInfo"
        - "LanguageDependencies"
        - "DependencyRule"
        - "ArchitectureStyle"
        - "Layer"
        - "Module"
        - "ArchitectureRule"
        - "ApiExport"
        - "ApiRule"
        - "ApiSection"
        - "ValidationIssue"
        - "ValidationResult"
        - "WorkspaceValidation"
      stability: "stable"
      warning: "Use through ConfigService - do not import models directly unless extending CAP"

    infrastructure:
      location: "core/cap_core/infrastructure/**"
      exports:
        - "FileReader"
        - "FileReaderError"
      stability: "stable"
      warning: "Internal to cap-core - use ConfigService instead of FileReader directly"

    mcp_tools:
      location: "mcp/cap_mcp/tools/**"
      exports:
        - "dependencies.register"
        - "architecture.register"
        - "api.register"
      stability: "stable"
      warning: "Internal to cap-mcp - tool registration happens in server.py"

    cli_utils:
      location: "shells/cli/cap_cli/utils/**"
      exports:
        - "get_workspace"
        - "validate_workspace"
        - "console"
        - "print_success"
        - "print_error"
        - "print_warning"
        - "print_info"
      stability: "stable"
      warning: "Internal to cap-cli"

    vscode_setup:
      location: "shells/vscode/src/setup/**"
      exports:
        - "findPython"
        - "setupEnvironment"
        - "checkForUpdate"
      stability: "stable"
      warning: "Internal to cap-vscode"

    vscode_utils:
      location: "shells/vscode/src/utils/**"
      exports:
        - "pickWorkspaceFolder"
        - "getCapExecutable"
        - "getVenvPython"
        - "createCapDirectoryWatcher"
      stability: "stable"
      warning: "Internal to cap-vscode"

rules:
  forbid:
    - path: "mcp/cap_mcp/tools/**"
      api: "internal.infrastructure"
      reason: "MCP tools should use ConfigService, not FileReader directly"
    - path: "shells/cli/**"
      api: "internal.infrastructure"
      reason: "CLI should use ConfigService, not FileReader directly"

notes:
  - "ConfigService is the primary facade for all config loading operations"
  - "ValidationService is the primary facade for all validation operations"
  - "create_server() is the composition root for the MCP server"
  - "Config domain models (DependenciesYAML, ArchitectureYAML, ApiYAML) are Pydantic BaseModel subclasses - use model_validate() and model_dump()"
  - "Validation domain models (ValidationIssue, ValidationResult, WorkspaceValidation) are stdlib dataclasses - pure data, no Pydantic dependency"
