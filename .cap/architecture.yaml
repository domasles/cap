# CAP Project Architecture

architecture:
  style: "hexagonal"

layers:
  domain:
    owns: "core/cap_core/domain/**"
    may_import: []

  infrastructure:
    owns: "core/cap_core/infrastructure/**"
    may_import:
      - "domain"

  application:
    owns: "core/cap_core/application/**"
    may_import:
      - "domain"
      - "infrastructure"

  mcp_shell:
    owns: "mcp/cap_mcp/**"
    may_import:
      - "application"
      - "domain"

  cli_shell:
    owns: "shells/cli/cap_cli/**"
    may_import:
      - "application"
      - "domain"
      - "mcp_shell"

  vscode_shell:
    owns: "shells/vscode/src/**"
    may_import: []

modules:
  cap_core:
    owns: "core/cap_core/**"
    purpose: "Core parsing library - loads .cap/ YAML files, validates against Pydantic models, formats for MCP output"

  cap_mcp:
    owns: "mcp/cap_mcp/**"
    purpose: "MCP server shell - registers tools on FastMCP, serves over stdio transport"

  cap_cli:
    owns: "shells/cli/cap_cli/**"
    purpose: "CLI shell - provides cap init, cap serve, cap validate, and cap compatibility commands. Defines version compatibility matrix in config.py."

  cap_vscode:
    owns: "shells/vscode/src/**"
    purpose: "VS Code extension - discovers Python, manages isolated venv, registers MCP server provider, runs cap CLI as subprocess. Checks CLI compatibility, coordinates cross-window pip updates via file-based lock."

rules:
  forbid:
    - path: "core/cap_core/domain/**"
      calls: "yaml.safe_load"
      reason: "Domain layer must not do file I/O - that belongs in infrastructure"
    - path: "core/cap_core/domain/**"
      calls: "open"
      reason: "Domain layer must not do file I/O - that belongs in infrastructure"
    - path: "core/cap_core/**"
      calls: "mcp.server"
      reason: "Core must not depend on MCP SDK - protocol concerns belong in the mcp shell"
    - path: "core/cap_core/**"
      calls: "click"
      reason: "Core must not depend on CLI framework - that belongs in the cli shell"
    - path: "mcp/cap_mcp/**"
      calls: "click"
      reason: "MCP shell must not depend on CLI framework"
    - path: "mcp/cap_mcp/**"
      calls: "rich"
      reason: "MCP shell must not use terminal formatting - stdout is for MCP protocol"
    - path: "shells/vscode/src/**"
      calls: "import"
      reason: "VS Code extension is TypeScript - it must never import Python modules directly"

notes:
  - "This is a monorepo with 4 packages: cap-core, cap-mcp, cap-cli (Python) and cap-vscode (TypeScript)"
  - "Python dependency flow: cli -> mcp -> core. Never the reverse."
  - "cap-vscode calls cap CLI as a subprocess - it never imports Python"
  - "Config domain models (Pydantic BaseModel) are pure data - no I/O, no side effects"
  - "Validation domain models (dataclasses) are pure data - no I/O, no side effects"
  - "ConfigService is the main entry point for loading configs from core"
  - "ValidationService handles validation concerns separately from loading"
  - "MCPFormatter transforms domain models to MCP-compatible JSON dicts"
  - "FileReader is the only class that touches the filesystem"
  - "server.py is the composition root for the MCP server - wires ConfigService into tools"
  - "Each MCP tool is in its own file with a register() function that closes over ConfigService"
  - "The VS Code extension uses vscode.lm.registerMcpServerDefinitionProvider for agent discovery"
  - "McpProviderHandle supports dispose()/reregister() for pausing MCP servers during pip updates"
  - "Cross-window update coordination uses a file-based lock (.cap-updating) in the shared venv directory"
  - "cap compatibility --json is the protocol for CLI-to-extension version compatibility checking"
