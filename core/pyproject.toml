[build-system]
requires = ["setuptools>=80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-core"
dynamic = ["version"]
description = "CAP Core: Codebase-Awareness Protocol parsing library"

authors = [{name = "Domas Leščinskas", email = "domas.lescinskas@gmail.com"}]
license = {text = "Apache-2.0"}

keywords = ["ai", "mcp", "codebase", "documentation", "developer-tools", "parsing"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Code Generators",

    "License :: OSI Approved :: Apache Software License",

    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Operating System :: OS Independent",
]

requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.3",
    "pydantic>=2.12.5",
]

[project.urls]
"Homepage" = "https://github.com/domasles/cap"
"Bug Reports" = "https://github.com/domasles/cap/issues"
"Source" = "https://github.com/domasles/cap"
"Documentation" = "https://github.com/domasles/cap#readme"

[tool.setuptools.dynamic]
version = {attr = "cap_core.meta.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["cap_core*"]
