[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-cli"
dynamic = ["version"]
description = "CAP CLI: Command-line interface for Codebase Awareness Protocol"

authors = [{name = "Domas Leščinskas", email = "domas.lescinskas@gmail.com"}]
license = {text = "Apache-2.0"}

keywords = ["ai", "mcp", "cli", "codebase", "developer-tools"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Documentation",

    "License :: OSI Approved :: Apache Software License",

    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",

    "Operating System :: OS Independent",
    "Environment :: Console",
]

requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "cap-mcp==0.1.0",
]

[project.urls]
"Homepage" = "https://github.com/domasles/cap"
"Bug Reports" = "https://github.com/domasles/cap/issues"
"Source" = "https://github.com/domasles/cap"
"Documentation" = "https://github.com/domasles/cap#readme"

[project.scripts]
cap = "cap_cli.main:cli"

[tool.setuptools.dynamic]
version = {attr = "src.meta.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
