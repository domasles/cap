[build-system]
requires = ["setuptools>=80.10.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-cli"
dynamic = ["version"]
description = "CAP CLI: Command-line interface for Codebase Awareness Protocol"

readme = "README.md"
authors = [{name = "Domas Leščinskas", email = "domas.lescinskas@gmail.com"}]
license = {text = "Apache-2.0"}

keywords = ["ai", "mcp", "cli", "codebase", "developer-tools"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",

    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Documentation",

    "License :: OSI Approved :: Apache Software License",

    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Operating System :: OS Independent",
    "Environment :: Console",
]

requires-python = ">=3.11"
dependencies = [
    "click>=8.3.1",
    "rich>=13.3.2",
    "cap-mcp==1.1.2",
]

[project.urls]
"Homepage" = "https://github.com/domasles/cap"
"Bug Reports" = "https://github.com/domasles/cap/issues"
"Source" = "https://github.com/domasles/cap"
"Documentation" = "https://github.com/domasles/cap#readme"

[project.scripts]
cap = "cap_cli.main:cli"

[tool.setuptools.dynamic]
version = {attr = "cap_cli.meta.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["cap_cli*"]
