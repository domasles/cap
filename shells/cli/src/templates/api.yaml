# Example api.yaml for CAP
#
# This file defines the public and internal APIs exported by your codebase.
# AI agents use this to understand what functionality is available and how to use it.

api:
  # Public API - stable interface for external consumers
  public:
    core_functions:
      location: "src/api.py"
      exports:
        - "initialize"
        - "process_data"
        - "get_results"
      stability: "stable"
    
    # Add more public API exports here
    # module_name:
    #   location: "src/module/public.py"
    #   exports:
    #     - "function_name"
    #   stability: "stable"  # stable, experimental, deprecated
  
  # Internal API - for use within the project only
  internal:
    utilities:
      location: "src/utils/**"
      exports:
        - "helper_function"
        - "internal_validator"
      warning: "Internal use only - may change without notice"
    
    # Add more internal API exports here

