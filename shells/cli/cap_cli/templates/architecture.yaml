# Example architecture.yaml for CAP
#
# This file defines the architecture patterns and structure of your codebase.
# AI agents use this to understand code organization and respect architectural boundaries.

architecture:
  style: "layered"  # Options: layered, hexagonal, microservices, monolithic, etc.

# Define architectural layers (for layered architecture)
layers:
  presentation:
    owns: "src/presentation/**"
    may_import:
      - "application"
      - "domain"
  
  application:
    owns: "src/application/**"
    may_import:
      - "domain"
      - "infrastructure"
  
  domain:
    owns: "src/domain/**"
    may_import: []  # Domain should be dependency-free
  
  infrastructure:
    owns: "src/infrastructure/**"
    may_import:
      - "domain"

# Define modules and their purposes
modules:
  core:
    owns: "src/core/**"
    purpose: "Core business logic and domain models"
  
  # Add more modules here
  # module_name:
  #   owns: "src/module/**"
  #   purpose: "What this module is responsible for"
  #   owner: "team-name"            # optional
  #   forbidden_imports:             # optional
  #     - "src/other_module/**"

