name: Publish VS Code Extension

on:
  release:
    types: [ published ]

jobs:
  publish-vscode:
    name: Build and publish to VS Code marketplace
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: shells/vscode

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Copy README
        run: cp ../../README.md .

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --no-dependencies -p ${{ secrets.VSCE_PAT }}
