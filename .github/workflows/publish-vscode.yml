name: Publish VS Code Extension

on:
  release:
    types: [ published ]

jobs:
  publish-vscode:
    name: Build and publish to VS Code marketplace
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: shells/vscode

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Copy shared files
        run: |
          cp ../../README.md .
          cp ../../LICENSE .

      - name: Package .vsix
        run: npx @vscode/vsce package --no-dependencies --no-prepublish -o cap-vscode-${{ github.event.release.tag_name }}.vsix

      - name: Upload .vsix to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} cap-vscode-${{ github.event.release.tag_name }}.vsix

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --no-dependencies --no-prepublish -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        run: npx ovsx publish cap-vscode-${{ github.event.release.tag_name }}.vsix -p ${{ secrets.OVSX_PAT }}
