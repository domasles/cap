name: Publish VS Code Extension

on:
  workflow_dispatch:

jobs:
  publish-vscode:
    name: Build and publish to VS Code marketplace
    runs-on: ubuntu-latest

    permissions:
      contents: write

    defaults:
      run:
        working-directory: shells/vscode

    steps:
      - uses: actions/checkout@v4

      - name: Get Release Tag
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(gh release view --json tagName --template '{{.tagName}}')" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build extension
        run: npm run build

      - name: Copy shared files
        run: |
          cp ../../README.md .
          cp ../../LICENSE .

      - name: Package .vsix
        run: npx @vscode/vsce package --no-dependencies -o cap-vscode-${{ steps.vars.outputs.tag }}.vsix

      - name: Upload .vsix to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ steps.vars.outputs.tag }} cap-vscode-${{ steps.vars.outputs.tag }}.vsix --clobber

      - name: Publish to VS Code Marketplace
        continue-on-error: true
        run: npx @vscode/vsce publish --no-dependencies -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        continue-on-error: true
        run: npx ovsx publish cap-vscode-${{ steps.vars.outputs.tag }}.vsix -p ${{ secrets.OVSX_PAT }}
