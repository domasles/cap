api:
  public:
    UserService:
      location: application/services/user_service.py
      exports:
        - create_user
        - get_user
        - update_user
        - delete_user
      stability: stable

    BillingService:
      location: application/services/billing_service.py
      exports:
        - create_subscription
        - cancel_subscription
        - get_invoice
      stability: stable

  internal:
    AuthUtils:
      location: auth/utils.py
      exports:
        - hash_password
        - verify_password
        - generate_token
      warning: "Internal only, may change anytime"

    DatabaseHelper:
      location: infrastructure/database/helper.py
      exports:
        - execute_query
        - batch_insert
      warning: "Low-level helper, use repositories instead"

rules:
  forbid:
    - path: "**"
      api: AuthUtils.hash_password
      except:
        path: auth/**
      reason: "Password hashing must only be used within auth module"

    - path: api/**
      api: DatabaseHelper.*
      reason: "API layer must not access database helpers directly"

notes:
  - "Public APIs are part of the contract - avoid breaking changes"
  - "Internal APIs can change - do not export in Python package"
  - "Document all public API changes in CHANGELOG"
