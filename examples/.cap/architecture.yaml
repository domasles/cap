architecture:
  style: layered

layers:
  domain:
    owns: domain/**
    may_import: []

  application:
    owns: application/**
    may_import: [domain]

  infrastructure:
    owns: infrastructure/**
    may_import: [application, domain]

  api:
    owns: api/**
    may_import: [application, domain]

modules:
  auth:
    owns: auth/**
    purpose: "Authentication and authorization"
    owner: security-team
    forbidden_imports:
      - billing
      - payments

  billing:
    owns: billing/**
    purpose: "Billing and subscription management"
    owner: finance-team

  user_management:
    owns: users/**
    purpose: "User profile and account management"
    owner: platform-team

rules:
  forbid:
    - path: api/**
      calls: domain.*
      reason: "API layer must not call domain directly, use application services"

    - path: domain/**
      calls: infrastructure.*
      reason: "Domain must remain infrastructure-agnostic"

notes:
  - "Do not introduce ANY architectural changes without team approval"
  - "Follow clean architecture principles - dependencies point inward"
  - "Each layer can only import from layers below it"
